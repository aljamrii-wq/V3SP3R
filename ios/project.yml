# XcodeGen project spec for Vesper (iOS).
# Generate the Xcode project on a Mac / CI with:  xcodegen generate
# (the .xcodeproj is intentionally git-ignored and regenerated from this file)
name: Vesper
options:
  bundleIdPrefix: com.vesper
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Vesper:
    type: application
    platform: iOS
    sources:
      - path: Vesper
    settings:
      base:
        INFOPLIST_FILE: Vesper/App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.vesper.flipper
        PRODUCT_NAME: Vesper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES

  VesperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VesperTests
    dependencies:
      - target: Vesper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vesper.flipper.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Vesper:
    build:
      targets:
        Vesper: all
        VesperTests: [test]
    test:
      targets:
        - VesperTests
    run:
      config: Debug
