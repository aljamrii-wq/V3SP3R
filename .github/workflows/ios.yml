name: iOS CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    # macos-15 ships Xcode 16, which can read the project format XcodeGen emits
    # and provides the iOS 17+ SDK (SwiftData / Observation).
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Select an available iOS simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys
d = json.load(sys.stdin)['devices']
ids = [dev['udid'] for rt in d for dev in d[rt] if dev.get('isAvailable') and 'iPhone' in dev.get('name','')]
print(ids[0] if ids else '')")
          if [ -z "$UDID" ]; then echo "No iOS simulator available" >&2; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build and test
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project Vesper.xcodeproj \
            -scheme Vesper \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults \
            clean build test \
            CODE_SIGNING_ALLOWED=NO
